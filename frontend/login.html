<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Login | Sistema de Presença</title>
</head>
<body>
    <main class="login">
        <section class="login_card">
            <div class="login_header">
                <img src="src/assets/images/favicon-128.png" alt="logo presenca">
                <h1 class="login_title">Sistema de Presença</h1>
                <p class="login_subtitle">Faça login para continuar</p>
            </div>
            <form class="login_form">
                <div class="form_group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <img src="src/assets/icons/icon mail.svg" alt="icone de email" class="input-icon">
                        <input id="email" type="email" placeholder="Digite seu email" required autocomplete="email">
                    </div>
                    <div class="login-error"><p>E-mail ou senha incorretos</p></div>
                </div>
                <div class="form_group">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <img src="src/assets/icons/icon lock.svg" alt="icone de cadeado" class="input-icon">
                        <input id="password" type="password" placeholder="**********" required autocomplete="password">
                    </div>
                </div>
                <button type="submit" class="login_button">Entrar</button>
                <p class="login_register">Não possui uma conta?<a href="#">Criar conta</a></p>
            </form>
        </section>
    </main>
</body>
</html>
